
<!DOCTYPE html>

<head>

    <!-- Sets the character encoding so special characters display correctly. -->

    <!-- The title appears in the browser tab. -->

    <!-- A short description of the page used by search engines. -->

    <!-- Open Graph metadata controls how the page looks when shared on social media. -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="Final Project">
    <meta property="og:description" content="A final project for CART 211.">



    <!-- The dimensions and alternative description of the preview image. -->
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="unsure final project related">

    <!-- Twitter card metadata controls the appearance of shared links on X. -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Final Project">
    <meta name="twitter:description" content="A final project for CART 211.">
    <meta name="twitter:image" content="https://hybrid.concordia.ca/yourname/hony/assets/america_pageant_og.jpg">


    <!-- Adds a small icon to the browser tab. -->
    <link rel="icon" href="assets/favicon.ico">

    <!-- Identifies the author and copyright information. -->
    <meta name="author" content="Josephine Desplanques">
    <meta name="copyright" content="© Josephine Desplanques, student project, 2025">

    <!-- Connects this HTML file to the external CSS stylesheet. -->
    <!-- The CSS controls colours, fonts, spacing, layout, and responsiveness. -->
    <link rel="stylesheet" href="default.css">

    <!-- Makes the page adapt to the width of mobile devices. -->
    <!-- Without this, mobile browsers may display the page as if it were desktop-sized. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Loads Google Fonts that can be used in the CSS stylesheet. -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

    <!-- Establishes an early connection to Google Fonts to help them load faster. -->
    <link rel="preconnect" href="https://fonts.gstatic.com">

    <!-- Loads Libre Franklin, another font used by the website. -->
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100;0,400;0,900;1,100;1,900&display=swap"
        rel="stylesheet">

    <!-- Loads Font Awesome, a library of ready-made icons. -->
    <!-- The social media icons and hamburger menu use this library. -->
     <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>

<body>
    <!-- Everything inside the body is part of the visible webpage. -->


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="wave" x="-5%" y="-5%" width="110%" height="110%">

            <!-- Animated noise that drives the wobble. -->
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.02" numOctaves="1" result="noise">
                <animate attributeName="baseFrequency"
                         dur="4s"
                         values="0.01 0.02; 0.02 0.035; 0.01 0.02"
                         repeatCount="indefinite" />
            </feTurbulence>

            <!-- Warps the image using the noise. -->
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" result="warped" />

            <!-- Blurs the warped image, and the blur amount pulses between 1 and 3. -->
            <feGaussianBlur in="warped" stdDeviation="2">
                <animate attributeName="stdDeviation"
                         dur="2s"
                         values="1; 3; 1"
                         repeatCount="indefinite" />
            </feGaussianBlur>
        </filter>
    </svg>

    <!-- Main wrapper: groups the page content together. -->
    <!-- CSS uses #wrapper to control the overall width and centre the content. -->
    <div id="wrapper">

        <!-- HEADER: contains the logo and navigation menu. -->
        <header>

            <!-- NAV: contains links that help visitors move around the website. -->
            <nav>

                <!-- Logo: clicking the image takes the visitor to the linked page. -->
                <div class="logo">
                    <a href="#">
                        <!-- The alt attribute describes the image for screen readers. -->
                        <img src="assets/logo.png" alt="Logo" width="110" height="50">
                    </a>
                </div>

                <!-- Navigation links.
                     CSS displays these horizontally on desktop
                     and as a menu panel on smaller screens. -->
                <div class="menu1">

                    <!-- The X button closes the mobile navigation menu. -->
                    <button type="button" class="close-menu" aria-label="Close navigation menu">
                        &times;
                    </button>

                    <a class="menuI" href="brazil.html">BRAZIL</a>
                    <a class="menuI" href="france.html">FRANCE</a>
                    <a class="menuI" href="serbia.html">SERBIA</a>
                    <a class="menuI" href="india.html">INDIA</a>
                    <a class="menuI" href="wwstats.html">WWSTATS</a>
                    <a class="menuI" href="game.html">GAME</a>

                </div>

                <!-- Hamburger button: displayed on mobile and tablet screens. -->
                <div class="hamburger-menu">

                    <button type="button" aria-label="Open navigation menu">
                        <!-- Font Awesome displays the three horizontal menu lines. -->
                        <span class="fa fa-bars" aria-hidden="true"></span>
                    </button>

                </div>

            </nav>
        </header>

        <!-- SECTION: groups the main content of the page. -->
        <section>

            <!-- ARTICLE: contains a related piece of written and visual content. -->
            <article>

                <!-- H1 is the main heading of the page. -->
                <!-- A page generally uses one main H1 heading. -->
                <h1 class="glitch" data-text="Humans of New York">WELCOME TO WEBSITE</h1>

                <!-- Introductory paragraph.
                     The intro class lets CSS apply specific font and spacing styles. -->
                <p class="intro">
                    This is the intro! Very basic layout and glitch effect on buttons. 
                </p>

                <!-- A second introductory paragraph explaining the project. -->
                <a href="menu2.html">Click here to get to part2</a>
                </p>

            </article>
        </section>

        <!-- FOOTER: contains social media icons and project credits. -->
        <footer>

            <!-- Groups the social icons and credits together. -->
            

        
            <!-- End of social section. -->

        </footer>
        <!-- End of footer. -->

    </div>
    <!-- End of the main wrapper. -->


    <!-- JAVASCRIPT:
         Makes the mobile hamburger menu open and close.
         JavaScript adds or removes a CSS class.
         The CSS decides what the menu looks like when that class is present. -->

    <script>

        // Wait until the HTML document has finished loading.
        // This ensures the buttons exist before JavaScript tries to select them.
        document.addEventListener('DOMContentLoaded', () => {

            // Find the hamburger button inside the mobile menu container.
            const hamburgerButton =
                document.querySelector('.hamburger-menu button');

            // Find the X button used to close the navigation menu.
            const closeButton =
                document.querySelector('.close-menu');

            // Find the container holding the navigation links.
            const menu1 =
                document.querySelector('.menu1');


            // When the hamburger button is clicked,
            // add the class "menu-deployed" to the navigation menu.
            // The CSS uses this class to make the menu visible.
            hamburgerButton.addEventListener('click', () => {
                menu1.classList.add('menu-deployed');
            });


            // When the X button is clicked,
            // remove "menu-deployed" so the menu closes.
            closeButton.addEventListener('click', () => {
                menu1.classList.remove('menu-deployed');
            });

        });

    </script>
    <!-- End of JavaScript. -->

<script src="matrix.js"></script>
</body>
</html>
